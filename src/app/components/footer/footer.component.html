<footer class="footer">
  <div class="footer-container">
    <div class="footer-top">
      <!-- Brand & Mission -->
      <div class="footer-brand">
        <a href="#" class="brand-link" (click)="scrollToTop($event)">
          <span class="logo-box">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
          </span>
          <span class="logo-text">Gutu<span class="highlight">.dev</span></span>
        </a>
        <p class="brand-subtext">
          Building dependable, secure web applications and practical digital solutions.
        </p>
      </div>

      <!-- Quick Links -->
      <div class="footer-nav">
        <h4 class="nav-title">Navigation</h4>
        <div class="nav-grid">
          <a href="#about" (click)="scrollTo('#about', $event)">About Me</a>
          <a href="#skills" (click)="scrollTo('#skills', $event)">Skills &amp; Tech</a>
          <a href="#projects" (click)="scrollTo('#projects', $event)">Projects</a>
          <a href="#experience" (click)="scrollTo('#experience', $event)">Work Experience</a>
          <a href="#contact" (click)="scrollTo('#contact', $event)">Contact</a>
        </div>
      </div>

      <!-- Back to Top CTA -->
      <div class="footer-actions">
        <h4 class="nav-title">Quick Action</h4>
        <button class="btn-top" (click)="scrollToTop($event)" aria-label="Scroll back to top">
          <span>Back to Top</span>
          <div class="top-icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </div>
        </button>
      </div>
    </div>

    <!-- Bottom Line -->
    <div class="footer-bottom">
      <div class="copyright-text">
        © {{ currentYear }} <span class="white-text">{{ profile.name }}</span>. All rights reserved.
      </div>
    </div>
  </div>
</footer>
